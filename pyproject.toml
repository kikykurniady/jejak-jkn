[project]
name = "jejak-jkn"
version = "0.1.0"
description = "JEJAK-JKN: prioritas klaim berisiko JKN (data sintetis)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pandera>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
